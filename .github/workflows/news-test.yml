name: Gemini News Test

on:
  workflow_dispatch:

jobs:
  test-gemini-news:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v6

      - name: نصب Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: نصب کتابخانه‌ها
        run: pip install -r requirements.txt

      - name: تست بازنویسی خبر با Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python test_news_gemini.py
