name: ZAI Test

on:
  workflow_dispatch:

jobs:
  test-zai:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v6

      - name: نصب Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: نصب کتابخانه‌ها
        run: pip install -r requirements.txt

      - name: تست Z.AI
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python test_zai.py
