name: Test Football News Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: بررسی فایل‌های پروژه
        run: |
          echo "===== فایل‌های پروژه ====="
          ls -la

          echo
          echo "===== نسخه Python ====="
          python --version

      - name: اجرای main.py
        run: |
          python main.py
