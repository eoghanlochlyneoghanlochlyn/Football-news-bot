name: Test Football News Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-news-bot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4

      - name: راه‌اندازی Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: بررسی متغیرهای محیطی
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

        run: |
          python -c "import os; print('TELEGRAM_BOT_TOKEN:', bool(os.getenv('TELEGRAM_BOT_TOKEN'))); print('TELEGRAM_CHANNEL:', bool(os.getenv('TELEGRAM_CHANNEL'))); print('GEMINI_API_KEY_1:', bool(os.getenv('GEMINI_API_KEY_1'))); print('GEMINI_API_KEY_2:', bool(os.getenv('GEMINI_API_KEY_2'))); print('GEMINI_API_KEY_3:', bool(os.getenv('GEMINI_API_KEY_3'))); print('GEMINI_API_KEY_4:', bool(os.getenv('GEMINI_API_KEY_4'))); print('GEMINI_API_KEY_5:', bool(os.getenv('GEMINI_API_KEY_5')))"

      - name: اجرای ربات
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}

          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

        run: |
          python main.py

      - name: ذخیره seen_news
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          git commit -m "Update seen news cache" || echo "No changes to commit"

          git push
